  <rect x="390" y="350" width="190" height="130" rx="14" fill="#333"/>
  <circle cx="265" cy="385" r="18" fill="#ddd"/>
  <circle cx="485" cy="385" r="18" fill="#ddd"/>
  <rect x="210" y="430" width="110" height="20" rx="8" fill="#ddd"/>
